[package]
name = "personal-taoli-tauri"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Taoli Observer Tauri desktop application"
publish = false

[lib]
name = "personal_taoli_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "personal-taoli"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.39", features = ["serde-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
personal-taoli-core = { path = "../crates/core" }
