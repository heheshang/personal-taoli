version: '3.8'

services:
  taoli-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: taoli-core
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://taoli:taoli@localhost:5432/taoli}
      - RUST_LOG=${RUST_LOG:-info}
      - TAOLI_MODE=${TAOLI_MODE:-observe}
      - TAOLI_CONFIG_PATH=${TAOLI_CONFIG_PATH:-/app/config/config.toml}
    volumes:
      - ../config:/app/config
      - taoli-data:/app/data
      - taoli-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - taoli-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: taoli-postgres
    environment:
      - POSTGRES_DB=taoli
      - POSTGRES_USER=taoli
      - POSTGRES_PASSWORD=taoli
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taoli -d taoli"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - taoli-network

  prometheus:
    image: prom/prometheus:latest
    container_name: taoli-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - taoli-network

  grafana:
    image: grafana/grafana:latest
    container_name: taoli-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - taoli-network

volumes:
  taoli-data:
  taoli-logs:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  taoli-network:
    driver: bridge
