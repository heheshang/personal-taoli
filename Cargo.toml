[package]
name = "personal-taoli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only cryptocurrency arbitrage observer and PAPER safety core"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
rust_decimal = { version = "1.39", features = ["serde-str", "db-postgres"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
toml = "0.9"
zeroize = "1.8"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
