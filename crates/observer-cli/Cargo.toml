[package]
name = "personal-taoli-observer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only command-line observer for Taoli"
publish = false

[[bin]]
name = "personal-taoli-observer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
personal-taoli-core = { path = "../core" }
