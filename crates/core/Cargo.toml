[package]
name = "personal-taoli-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Domain and infrastructure core for the Taoli observer"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
rust_decimal = { version = "1.39", features = ["serde-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
toml = "0.9"
zeroize = "1.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "rust_decimal", "json", "migrate", "macros"] }
tracing = "0.1"
